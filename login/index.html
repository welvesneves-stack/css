<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Tela de login</title>
</head>

<body>
    <div class="container" id="container">
        <div class="lado1" id="lado1">
            <div class="esq" id="esq">
                <h1>Bem-vindo!</h1>
                <p>Ainda não possui uma conta?</p>
                <button id="reg">Registrar</button>
            </div>
            <div class="dir" id="dir">
                <h1>Bem-vindo!</h1>
                <p>Já possui uma conta?</p>
                <button id="ent">Entrar</button>
            </div>
        </div>
        <div class="lado2" id="lado2">
            <div class="entrar" id="entrar">
                <h1>Entrar</h1>
                <div>
                    <input type="text" name="" id="" placeholder="Nome do usuário" required>
                   <a> <i class="fa-solid fa-user"></i></a>
                </div>
                <div>
                    <input type="password" name="" id="" placeholder="Senha" required>
                    <a><i class="fa-solid fa-lock"></i></a>
                </div>
                <button>Entrar</button>
                <p>Entrar com</p>
                <div>
                    <a href=""><i class="fa-brands fa-github"></i></a>
                    <a href=""><i class="fa-brands fa-google"></i></a>
                    <a href=""><i class="fa-brands fa-facebook"></i></a>
                    <a href=""><i class="fa-brands fa-linkedin"></i></a>
                </div>
            </div>
            <div class="registrar" id="registrar">
                <h1>Registrar</h1>
                <div>
                    <input type="text" name="" id="" placeholder="Nome do usuário" required>
                    <a><i class="fa-solid fa-user"></i></a>
                </div>
                <div>
                    <input type="email" name="" id="" placeholder="Email" required>
                    <a><i class="fa-regular fa-envelope"></i></a>
                </div>
                <div>
                    <input type="password" name="" id="" placeholder="Senha">
                   <a><i class="fa-solid fa-lock"></i></a>
                </div>
                <div>
                    <input type="password" name="" id="" placeholder="Confirmar senha">
                    <a><i class="fa-solid fa-eye"></i></a>
                </div>
                <button>Registrar</button>
                <p>Registrar com</p>
                <div>
                    <a href=""><i class="fa-brands fa-github"></i></a>
                    <a href=""><i class="fa-brands fa-google"></i></a>
                    <a href=""><i class="fa-brands fa-facebook"></i></a>
                    <a href=""><i class="fa-brands fa-linkedin"></i></a>
                </div>
            </div>
        </div>

    </div>






    <script>
        let reg=window.document.getElementById("reg")
        let entrar =window.document.getElementById("entrar")
        let registrar =window.document.getElementById("registrar")
        let ent=window.document.getElementById("ent")
        let dir = window.document.getElementById("dir")
        let esq = window.document.getElementById("esq")
        let container =window.document.getElementById("container")
        let lado1 =window.document.getElementById("lado1")

        reg.addEventListener("click",registro)
        ent.addEventListener("click",entra)

        function registro(){
            if(entrar.style.position = "absolute"){
                entrar.style.left = 100 + "%"
                registrar.style.left = 0 + "%"
                esq.style.right = 100 + "%"
                dir.style.right = 0 + "%"
                container.style.flexDirection = "row-reverse"
                lado1.style.borderBottomLeftRadius = 60 + "px"
                lado1.style.borderBottomRightRadius = 0 + "px"
                lado1.style.borderTopLeftRadius = 60 + "px"
                lado1.style.borderTopRightRadius = 0 + "px"
                esq.style.visibility = "hidden"
            }
        }

        function entra(){
              if(entrar.style.position = "absolute"){
                entrar.style.left = 0 + "%"
                registrar.style.left = 100 + "%"
                esq.style.right = 0 + "%"
                dir.style.right = 100 + "%"
                container.style.flexDirection = "row"
                lado1.style.borderBottomLeftRadius = 0 + "px"
                lado1.style.borderBottomRightRadius = 60 + "px"
                lado1.style.borderTopLeftRadius = 0 + "px"
                lado1.style.borderTopRightRadius = 60 + "px"
                esq.style.visibility = "visible"
            }
        }
    </script>
</body>

</html>
