<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Grid.css">
    <title>gridLayout</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Cabeçalho do site</h1>
        </header>
        <section class="sec1">
            <nav>
                <li>Início</li>
                <li>Sobre</li>
                <li>Serviços</li>
                <li>Contactos</li>
            </nav>
        </section>
        <main>
            <h1>Bem-vindo!</h1>
            <p>Este é o conteúdo principal do site.</p>
            <button>Clique aqui</button>
        </main>
        <section class="sec2">
            <label for="pesq">Pesquisa</label><br>
            <input type="text" name="" id="pesq" placeholder="Digite aqui">
            <button>Pesquisar</button>
        </section>
        <footer>
            <span>Rodapé &copy 2025</span>
        </footer>
    </div>
</body>
</html>
